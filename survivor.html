<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>픽셀 서바이버</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
:root{--ink:#f4ecd8;--bg:#140f1f;--panel:#231a35;--line:#4a3a6b;--gold:#f1c40f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Galmuri11','Galmuri9',monospace}
#game{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#hud{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(10,6,18,.72);padding:16px;text-align:center;overflow:auto}
.hidden{display:none!important}
h1{font-size:40px;letter-spacing:2px;color:var(--gold);text-shadow:4px 4px 0 #000}
.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.card{width:220px;background:var(--panel);border:4px solid var(--line);padding:16px;cursor:pointer;text-align:left;transition:transform .1s;box-shadow:6px 6px 0 #000}
.card:hover{transform:translateY(-4px);border-color:var(--gold)}
.card canvas{width:96px;height:96px;image-rendering:pixelated;display:block;margin:0 auto 8px}
.card h2{font-size:18px;margin-bottom:6px;color:var(--gold)}
.card p{font-size:12px;line-height:1.7;opacity:.92}
.card .sk{margin-top:8px;color:#8fd3ff}
.help{font-size:13px;opacity:.85;line-height:1.9}
button.btn{font:inherit;font-size:16px;padding:10px 20px;background:var(--panel);color:var(--ink);border:4px solid var(--line);cursor:pointer;box-shadow:4px 4px 0 #000}
button.btn:hover{border-color:var(--gold)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="hud"></canvas>

<div id="title" class="screen">
  <h1>픽셀 서바이버</h1>
  <div class="help">WASD / 방향키 이동 · Q/E 카메라 회전 · 마우스 휠 줌<br>SPACE 스킬 · 공격은 자동 · ESC 일시정지</div>
  <div class="cards" id="classCards"></div>
</div>
<div id="levelup" class="screen hidden"><h1>레벨 업!</h1><div class="help">클릭하거나 1 / 2 / 3 키로 선택</div><div class="cards" id="upCards"></div></div>
<div id="over" class="screen hidden">
  <h1>쓰러졌다...</h1>
  <div id="overStats" class="help"></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="btn" id="retry">다시 하기</button><button class="btn" id="toTitle">직업 선택</button>
  </div>
</div>
<div id="pause" class="screen hidden"><h1>일시정지</h1><div class="help">ESC로 계속하기</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const U = 0.1; // 1픽셀 = 0.1 월드 단위
const WORLD_R = 55;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
let seed = 1337;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

// ================= 도트 그래픽 =================
function pixCanvas(rows, pal, flip) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((r, y) => {
    for (let x = 0; x < w; x++) {
      const ch = r[x] || '.';
      if (ch === '.' || !pal[ch]) continue;
      g.fillStyle = pal[ch]; g.fillRect(flip ? w - 1 - x : x, y, 1, 1);
    }
  });
  return c;
}
function overlayRows(base, ov) {
  return base.map((r, y) => {
    const o = ov[y] || ''; let s = '';
    for (let x = 0; x < Math.max(r.length, o.length); x++) { const c = o[x]; s += (c && c !== '.') ? c : (r[x] || '.'); }
    return s;
  });
}
function mkTex(c) {
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  return t;
}
function frames(list, pal) {
  return {
    r: list.map(rows => mkTex(pixCanvas(rows, pal, false))),
    l: list.map(rows => mkTex(pixCanvas(rows, pal, true))),
    w: Math.max(...list[0].map(r => r.length)), h: list[0].length,
  };
}

// ================= 직업 =================
const CLASSES = {
  berserker: {
    name: '버서커', hp: 170, speed: 4.3, cd: 8, ov: OV_AXE,
    desc: '거대한 도끼로 앞을 넓게 베어낸다. 체력이 낮을수록 더 강해진다.',
    skillName: '휠윈드', skillDesc: '3초간 회전하며 주변을 계속 벤다 (이동속도 +30%)',
    pal: { H: '#b8452d', B: '#7a4b2a', C: '#d4a52a', L: '#4a3423', A: '#cfd6de', W: '#7a4a24' },
    attack() {
      const R = 2.6 * P.st.area, t = nearest(P.x, P.z, R + 1.2);
      if (!t) return 0.12;
      const a = Math.atan2(t.z - P.z, t.x - P.x), arc = Math.PI * 0.85;
      fxSlash(P.x, P.z, a, R, arc, 0xffffff);
      for (const e of enemies) {
        if (e.dead) continue;
        const dx = e.x - P.x, dz = e.z - P.z, d = Math.hypot(dx, dz) || 1;
        if (d < R + e.r && Math.abs(angDiff(Math.atan2(dz, dx), a)) < arc / 2) hurt(e, 24, dx / d, dz / d, 6);
      }
      return 0.95;
    },
    skill() { P.spin = 3; P.spinTick = 0; fxSpin(); },
  },
  archer: {
    name: '궁수', hp: 95, speed: 5.0, cd: 6, ov: OV_BOW,
    desc: '멀리서 빠르게 화살을 쏜다. 몸은 약하지만 가장 빠르다.',
    skillName: '화살비 + 대시', skillDesc: '사방으로 화살 24발을 쏘며 이동 방향으로 구른다',
    pal: { H: '#3f8a3a', B: '#58a24a', C: '#9a6b3a', L: '#5a4632', W: '#8a5a2b', s: '#e8e8e8' },
    attack() {
      const t = nearest(P.x, P.z, 15);
      if (!t) return 0.1;
      const a = Math.atan2(t.z - P.z, t.x - P.x), n = 1 + P.st.proj;
      for (let i = 0; i < n; i++) shoot('arrow', a + (i - (n - 1) / 2) * 0.14, { spd: 18, dmg: 14, pierce: 1 + P.st.pierce, life: 1.1 });
      return 0.55;
    },
    skill() {
      for (let i = 0; i < 24; i++) shoot('arrow', i / 24 * TAU, { spd: 16, dmg: 16, pierce: 2 + P.st.pierce, life: 0.9 });
      const len = Math.hypot(P.moveX, P.moveZ);
      P.dash = 0.2;
      P.dashX = len ? P.moveX : Math.cos(P.faceAng);
      P.dashZ = len ? P.moveZ : Math.sin(P.faceAng);
    },
  },

    pal: { H: '#5a3fb0', B: '#6a52d0', C: '#f1c40f', L: '#4b3a9c', P: '#5a3fb0', Q: '#6ff3ff', W: '#7a4a24' },

      for (let i = 0; i < n; i++) shoot('bolt', a + (i - (n - 1) / 2) * 0.35, { spd: 10, dmg: 20, pierce: 0, life: 2, target: t, boom: 1.7 });

        const dx = e.x - P.x, dz = e.z - P.z, d = Math.hypot(dx, dz) || 1;

};
for (const k in CLASSES) {
  const C = CLASSES[k], pal = Object.assign({}, HERO_PAL, C.pal);
  C.rowsA = overlayRows(HERO_A, C.ov);
  C.fr = frames([C.rowsA, overlayRows(HERO_B, C.ov)], pal);
  C.palFull = pal;
}

const ETYPES = {
  slime: { fr: frames([SLIME], { O: '#14281a', G: '#5fd35a', W: '#d8ffd0', K: '#0e1a10', D: '#3a9a3e' }), hp: 18, spd: 2.1, dmg: 7, xp: 1, r: 0.45, sc: 1 },
  bat:   { fr: frames([BAT_A, BAT_B], { O: '#1a1024', P: '#7a4aa8', K: '#ff4040', W: '#ffffff' }), hp: 11, spd: 3.7, dmg: 5, xp: 1, r: 0.4, sc: 1, fly: true },
  mush:  { fr: frames([MUSH_A, MUSH_B], { O: '#2a1414', R: '#d23c3c', W: '#f4ecd8', T: '#e8d2a8', K: '#2a1414', M: '#b05050', F: '#5a3a2a' }), hp: 40, spd: 1.8, dmg: 11, xp: 3, r: 0.5, sc: 1.1 },
};

const UPS = [
  { id: 'dmg', name: '힘의 룬', desc: '공격력 +20%', apply: p => p.st.dmg *= 1.2 },
  { id: 'spd', name: '질풍', desc: '공격 속도 +15%', apply: p => p.st.atkSpd *= 1.15 },

// ================= 3D 장면 =================
const canvas = $('game'), hud = $('hud'), hctx = hud.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
const SKY = 0x8fc9e8;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 20, 44);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
let DPR = 1;
function resize() {
  const pix = Math.max(2, Math.round(innerHeight / 270));
  renderer.setSize(Math.ceil(innerWidth / pix), Math.ceil(innerHeight / pix), false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  DPR = window.devicePixelRatio || 1;
  hud.width = innerWidth * DPR; hud.height = innerHeight * DPR;
}
addEventListener('resize', resize); resize();

function groundCanvas() {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const g = c.getContext('2d');
  g.fillStyle = '#4c9b45'; g.fillRect(0, 0, 32, 32);
  const cols = ['#55a84d', '#438c3d', '#5cb352', '#3f8439'];
  for (let i = 0; i < 180; i++) { g.fillStyle = cols[(rnd() * 4) | 0]; g.fillRect((rnd() * 32) | 0, (rnd() * 32) | 0, 1, 1); }
  g.fillStyle = '#6cc25f';
  for (let i = 0; i < 6; i++) { const x = (rnd() * 30) | 0, y = (rnd() * 30) | 0; g.fillRect(x, y, 1, 2); g.fillRect(x + 1, y + 1, 1, 1); }
  return c;
}
const gTex = mkTex(groundCanvas());
gTex.wrapS = gTex.wrapT = THREE.RepeatWrapping;
gTex.repeat.set(140 / 3.2, 140 / 3.2);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshBasicMaterial({ map: gTex }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

function mkSprite(map, w, h, sc = 1, cy = 0) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map, alphaTest: 0.5, fog: true }));
  s.center.set(0.5, cy); s.scale.set(w * U * sc, h * U * sc, 1);
  scene.add(s); return s;
}
function mkSpriteShared(mat, w, h, sc = 1) {
  const s = new THREE.Sprite(mat); s.center.set(0.5, 0); s.scale.set(w * U * sc, h * U * sc, 1);
  scene.add(s); return s;
}
const shadowGeo = new THREE.CircleGeometry(0.5, 12); shadowGeo.rotateX(-Math.PI / 2);
const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false });
function mkShadow(s) { const m = new THREE.Mesh(shadowGeo, shadowMat); m.scale.set(s, 1, s * 0.8); m.position.y = 0.02; scene.add(m); return m; }

// 월드 장식
const obstacles = [];
(function buildWorld() {
  const treeTex = mkTex(pixCanvas(TREE, { O: '#12261a', G: '#3f9a48', L: '#7ad06a', D: '#2a6e36', B: '#6a4428', b: '#4a2e1a' }));
  const rockTex = mkTex(pixCanvas(ROCK, { O: '#1e1e28', L: '#c8c8d4', G: '#9898a8', D: '#6a6a7a' }));
  const tuftTex = mkTex(pixCanvas(TUFT, { G: '#5fbe55', D: '#2f7a34' }));
  const flowerTexes = ['#ffffff', '#ffd23f', '#ff7ab0'].map(c => mkTex(pixCanvas(FLOWER, { Y: c, W: '#fff4a0', G: '#2f7a34' })));
  const treeMat = new THREE.SpriteMaterial({ map: treeTex, alphaTest: 0.5, fog: true });
  const rockMat = new THREE.SpriteMaterial({ map: rockTex, alphaTest: 0.5, fog: true });
  const tuftMat = new THREE.SpriteMaterial({ map: tuftTex, alphaTest: 0.5, fog: true });
  const flowerMats = flowerTexes.map(t => new THREE.SpriteMaterial({ map: t, alphaTest: 0.5, fog: true }));
  const place = (mat, w, h, sc, x, z, r, sh) => {
    const s = mkSpriteShared(mat, w, h, sc); s.position.set(x, 0, z);
    if (sh) mkShadow(sh).position.set(x, 0.02, z);
    if (r) obstacles.push({ x, z, r });
  };
  for (let i = 0; i < 170; i++) {
    const a = rnd() * TAU, d = 7 + rnd() * (WORLD_R - 9), x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (rnd() < 0.65) place(treeMat, 16, 20, 1.8 + rnd() * 0.4, x, z, 0.7, 2.2);
    else place(rockMat, 16, 8, 1.1 + rnd() * 0.5, x, z, 0.8, 1.6);
  }
  for (let a = 0; a < TAU; a += 0.045) {
    for (let k = 0; k < 2; k++) {
      const d = WORLD_R + 1.5 + k * 2.5 + rnd() * 1.5;
      place(treeMat, 16, 20, 2 + rnd() * 0.6, Math.cos(a + k * 0.02) * d, Math.sin(a + k * 0.02) * d, 0, 2.4);
    }
  }
  for (let i = 0; i < 600; i++) {
    const a = rnd() * TAU, d = Math.sqrt(rnd()) * WORLD_R, x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (rnd() < 0.8) place(tuftMat, 8, 5, 1, x, z);

const arrowTex = mkTex(pixCanvas(ARROW, { F: '#e84a4a', W: '#8a5a2b', A: '#dfe6ee' }));
const boltTex = mkTex(pixCanvas(BOLT, { O: '#5a2fa0', Q: '#c28bff', W: '#ffffff' }));
const gemMats = ['#5fb8ff', '#5fe07a', '#ff5fd2'].map(c => new THREE.SpriteMaterial({ map: mkTex(pixCanvas(GEM, { O: '#1b1424', C: c, W: '#ffffff' })), alphaTest: 0.5, fog: true }));
const meatMat = new THREE.SpriteMaterial({ map: mkTex(pixCanvas(MEAT, { O: '#3a1a14', R: '#c8553d', W: '#f4ecd8' })), alphaTest: 0.5, fog: true });

// ================= 게임 상태 =================
let mode = 'title', P = null;
let enemies = [], projs = [], gems = [], fxs = [], floaters = [];
let gameTime = 0, spawnT = 0, eliteT = 0, pendingLv = 0, shake = 0;
let camYaw = 0, camDist = 11, titleYaw = 0, lastClass = 'berserker';
const keys = {};

function nearest(x, z, maxD) {
  let best = null, bd = maxD;
  for (const e of enemies) { if (e.dead) continue; const d = Math.hypot(e.x - x, e.z - z); if (d < bd) { bd = d; best = e; } }
  return best;
}
function dmgMul() {
  let m = P.st.dmg;
  if (P.key === 'berserker') m *= 1 + (1 - P.hp / P.maxHp) * 0.8;
  return m;
}
function floater(x, y, z, text, color, size) { floaters.push({ x, y, z, text: String(text), color, size, t: 0 }); }
function hurt(e, base, nx = 0, nz = 0, kb = 3) {
  if (e.dead) return;
  let d = base * dmgMul();
  const crit = Math.random() < P.st.crit;
  if (crit) d *= 2;
  d = Math.max(1, Math.round(d * (0.9 + Math.random() * 0.2)));
  e.hp -= d; e.flash = 0.1;
  const k = e.elite ? kb / 3 : kb;

  floater(e.x, e.h + 0.2, e.z, d, crit ? '#ffd23f' : '#ffffff', crit ? 20 : 14);

}
function killEnemy(e) {
  e.dead = true;
  scene.remove(e.sprite); e.sprite.material.dispose(); scene.remove(e.shadow);
  P.kills++;
  dropGem(e.x, e.z, e.xp);
  if (Math.random() < (e.elite ? 1 : 0.015)) dropMeat(e.x + 0.6, e.z);
}
function dropGem(x, z, val) {
  const mat = val >= 10 ? gemMats[2] : val >= 3 ? gemMats[1] : gemMats[0];
  gems.push({ x, z, val, kind: 'xp', sprite: mkSpriteShared(mat, 5, 6), ph: Math.random() * 6, pull: false });
}
function dropMeat(x, z) { gems.push({ x, z, val: 25, kind: 'meat', sprite: mkSpriteShared(meatMat, 8, 6, 1.2), ph: 0, pull: false }); }
function gainXp(v) {
  P.xp += v;
  while (P.xp >= P.xpNext) { P.xp -= P.xpNext; P.level++; P.xpNext = Math.floor(5 + P.level * 4 + Math.pow(P.level, 1.5)); pendingLv++; }
}
function shoot(kind, ang, o) {
  const tex = kind === 'arrow' ? arrowTex : boltTex;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, alphaTest: 0.5, fog: true }));
  if (kind === 'arrow') s.scale.set(1.0, 0.3, 1); else s.scale.set(0.7, 0.7, 1);
  scene.add(s);
  projs.push(Object.assign({ kind, x: P.x, z: P.z, y: 0.8, vx: Math.cos(ang) * o.spd, vz: Math.sin(ang) * o.spd, hit: new Set(), sprite: s }, o));
}
function explode(pr) {
  const R = pr.boom * P.st.area;
  fxRing(pr.x, pr.z, R, 0xc28bff, 0.25);
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.x - pr.x, dz = e.z - pr.z, d = Math.hypot(dx, dz) || 1;
    if (d < R + e.r) hurt(e, pr.dmg, dx / d, dz / d, 4);
  }
}

// ---- 이펙트 ----
function addFx(mesh, life, upd) { scene.add(mesh); fxs.push({ mesh, life, t: 0, upd }); }
function fxMat(color, op) { return new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op, side: THREE.DoubleSide, depthWrite: false }); }
function fxSlash(x, z, a, R, arc, color) {
  const m = fxMat(color, 0.75);
  const mesh = new THREE.Mesh(new THREE.RingGeometry(R * 0.3, R, 20, 1, -a - arc / 2, arc), m);
  mesh.rotation.x = -Math.PI / 2; mesh.position.set(x, 0.06, z);
  addFx(mesh, 0.18, f => { m.opacity = 0.75 * (1 - f.t / f.life); mesh.position.set(P.x, 0.06, P.z); });
}
function fxRing(x, z, R, color, life) {
  const m = fxMat(color, 0.8);
  const mesh = new THREE.Mesh(new THREE.RingGeometry(0.8, 1, 40), m);
  mesh.rotation.x = -Math.PI / 2; mesh.position.set(x, 0.07, z);
  addFx(mesh, life, f => { const k = f.t / f.life, s = R * (0.2 + 0.8 * k); mesh.scale.set(s, s, 1); m.opacity = 0.8 * (1 - k); });
}
function fxSpin() {
  const R = 2.9 * P.st.area, m = fxMat(0xffe0c0, 0.55);
  const mesh = new THREE.Mesh(new THREE.RingGeometry(R * 0.3, R, 24, 1, 0, Math.PI * 1.4), m);
  mesh.rotation.x = -Math.PI / 2;
  addFx(mesh, 3, (f, dt) => {
    mesh.position.set(P.x, 0.06, P.z); mesh.rotation.z += dt * 14;
    m.opacity = 0.55 * Math.min(1, (f.life - f.t) * 4);
  });
}

// ---- 적 ----
function spawnPos() {
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * TAU, d = 17 + Math.random() * 5;
    const x = P.x + Math.cos(a) * d, z = P.z + Math.sin(a) * d;
    if (Math.hypot(x, z) < WORLD_R - 1) return { x, z };
  }
  return { x: P.x * 0.55, z: P.z * 0.55 };
}
function pickKind() {
  const t = gameTime, r = Math.random();
  if (t < 25) return 'slime';
  if (t < 60) return r < 0.6 ? 'slime' : 'bat';
  return r < 0.4 ? 'slime' : r < 0.7 ? 'bat' : 'mush';
}
function spawnEnemy(k, elite = false) {
  const T = ETYPES[k], sc = T.sc * (elite ? 2 : 1), pos = spawnPos();
  const e = {
    kind: k, type: T, x: pos.x, z: pos.z, elite, sc,
    hp: T.hp * (1 + gameTime / 80) * (elite ? 10 : 1),
    spd: T.spd * (elite ? 0.85 : 1) * (1 + Math.min(0.4, gameTime / 600)),
    dmg: Math.round(T.dmg * (elite ? 1.8 : 1) * (1 + gameTime / 300)),
    xp: T.xp * (elite ? 15 : 1), r: T.r * (elite ? 1.8 : 1),
    kx: 0, kz: 0, flash: 0, slow: 0, anim: Math.random() * 10, ph: Math.random() * 6, face: 1,
  };
  e.maxHp = e.hp; e.h = T.fr.h * U * sc;
  e.sprite = mkSprite(T.fr.r[0], T.fr.w, T.fr.h, sc);
  e.shadow = mkShadow(0.9 * sc);
  enemies.push(e);
}
function collide(o, r) {
  for (const ob of obstacles) {
    const dx = o.x - ob.x, dz = o.z - ob.z, rr = r + ob.r;
    if (Math.abs(dx) > rr || Math.abs(dz) > rr) continue;
    const d = Math.hypot(dx, dz);
    if (d < rr && d > 1e-4) { o.x = ob.x + dx / d * rr; o.z = ob.z + dz / d * rr; }
  }
  const d = Math.hypot(o.x, o.z);
  if (d > WORLD_R) { o.x *= WORLD_R / d; o.z *= WORLD_R / d; }
}

// ================= 시작 / 초기화 =================
function clearWorld() {
  for (const e of enemies) { scene.remove(e.sprite); e.sprite.material.dispose(); scene.remove(e.shadow); }
  for (const p of projs) { scene.remove(p.sprite); p.sprite.material.dispose(); }
  for (const g of gems) scene.remove(g.sprite);
  for (const f of fxs) { scene.remove(f.mesh); f.mesh.geometry.dispose(); f.mesh.material.dispose(); }
  if (P) { scene.remove(P.sprite); scene.remove(P.shadow); }
  enemies = []; projs = []; gems = []; fxs = []; floaters = [];
}
function startGame(key) {
  clearWorld();
  lastClass = key;
  const C = CLASSES[key];
  P = {
    key, C, x: 0, z: 0, hp: C.hp, maxHp: C.hp, speed: C.speed, face: 1, faceAng: 0, moveX: 0, moveZ: 0,
    anim: 0, inv: 0, atkT: 0.5, skillT: 0, spin: 0, spinTick: 0, dash: 0, dashX: 0, dashZ: 0,
    level: 1, xp: 0, xpNext: 6, kills: 0, hurtFx: 0,
    st: { dmg: 1, atkSpd: 1, area: 1, proj: 0, pierce: 0, magnet: 2.6, regen: 0, steal: 0, crit: 0.05, cd: 1 },
    ups: {},
  };
  P.sprite = mkSprite(C.fr.r[0], 16, 16);
  P.shadow = mkShadow(0.9);
  gameTime = 0; spawnT = 1; eliteT = 50; pendingLv = 0; shake = 0; camYaw = 0;
  ['title', 'over', 'levelup', 'pause'].forEach(id => $(id).classList.add('hidden'));
  mode = 'play';

// ================= 업데이트 =================
function update(dt) {
  gameTime += dt;
  if (keys.KeyQ) camYaw += 1.8 * dt;
  if (keys.KeyE) camYaw -= 1.8 * dt;

  // 이동 (카메라 기준)
  const ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const iz = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
  let mx = fx * iz + rx * ix, mz = fz * iz + rz * ix;
  const ml = Math.hypot(mx, mz);
  if (ml > 0) { mx /= ml; mz /= ml; P.faceAng = Math.atan2(mz, mx); }
  P.moveX = mx; P.moveZ = mz;
  if (P.dash > 0) { P.dash -= dt; P.x += P.dashX * 22 * dt; P.z += P.dashZ * 22 * dt; }
  else { const sp = P.speed * (P.spin > 0 ? 1.3 : 1); P.x += mx * sp * dt; P.z += mz * sp * dt; }
  collide(P, 0.4);
  const sd = mx * rx + mz * rz;
  if (sd > 0.1) P.face = 1; else if (sd < -0.1) P.face = -1;

  // 공격 / 스킬
  P.atkT -= dt * P.st.atkSpd;
  if (P.atkT <= 0) P.atkT = P.C.attack();
  P.skillT -= dt;
  if (keys.Space && P.skillT <= 0) { P.C.skill(); P.skillT = P.C.cd * P.st.cd; }
  if (P.spin > 0) {
    P.spin -= dt; P.spinTick -= dt;
    if (P.spinTick <= 0) {
      P.spinTick = 0.22;
      const R = 2.9 * P.st.area;
      for (const e of enemies) {
        if (e.dead) continue;
        const dx = e.x - P.x, dz = e.z - P.z, d = Math.hypot(dx, dz) || 1;
        if (d < R + e.r) hurt(e, 11, dx / d, dz / d, 5);
      }
    }
  }
  P.hp = Math.min(P.maxHp, P.hp + P.st.regen * dt);
  P.inv -= dt; P.hurtFx -= dt;

  // 플레이어 그림
  if (ml > 0 || P.dash > 0) P.anim += dt * 8; else P.anim = 0;
  const frame = Math.floor(P.anim) % 2;
  const faceNow = P.spin > 0 ? (Math.floor(gameTime * 12) % 2 ? 1 : -1) : P.face;
  P.sprite.material.map = faceNow > 0 ? P.C.fr.r[frame] : P.C.fr.l[frame];
  P.sprite.position.set(P.x, ml > 0 ? Math.abs(Math.sin(P.anim * Math.PI / 2)) * 0.08 : 0, P.z);
  P.sprite.visible = !(P.inv > 0 && Math.floor(gameTime * 20) % 2);
  P.shadow.position.set(P.x, 0.02, P.z);

  // 적 생성
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnT = Math.max(0.25, 1.2 - gameTime * 0.005);
    const n = 1 + Math.floor(gameTime / 45);
    for (let i = 0; i < n && enemies.length < 260; i++) spawnEnemy(pickKind());
  }
  eliteT -= dt;
  if (eliteT <= 0) { eliteT = 45; spawnEnemy(gameTime > 90 ? 'mush' : 'slime', true); floater(P.x, 2.4, P.z, '강적 등장!', '#ffb347', 18); }

  // 적 이동
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = P.x - e.x, dz = P.z - e.z, d = Math.hypot(dx, dz) || 1;
    if (d > 38) { const p = spawnPos(); e.x = p.x; e.z = p.z; continue; }
    const slow = e.slow > 0 ? 0.45 : 1;
    e.slow -= dt;
    e.x += dx / d * e.spd * slow * dt + e.kx * dt;
    e.z += dz / d * e.spd * slow * dt + e.kz * dt;
    const k = Math.exp(-10 * dt); e.kx *= k; e.kz *= k;
    if (d < e.r + 0.4 && P.inv <= 0 && P.dash <= 0) {
      P.hp -= e.dmg; P.inv = 0.6; P.hurtFx = 0.3; shake = 0.25;
      floater(P.x, 1.8, P.z, '-' + e.dmg, '#ff5050', 16);
    }
    e.face = (dx * rx + dz * rz) > 0 ? 1 : -1;
  }
  // 적끼리 밀어내기
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (a.dead) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j]; if (b.dead) continue;
      const dx = b.x - a.x, dz = b.z - a.z, rr = a.r + b.r;
      if (Math.abs(dx) > rr || Math.abs(dz) > rr) continue;
      const d2 = dx * dx + dz * dz;
      if (d2 < rr * rr && d2 > 1e-6) {
        const d = Math.sqrt(d2), push = (rr - d) / 2, nx = dx / d, nz = dz / d;
        a.x -= nx * push; a.z -= nz * push; b.x += nx * push; b.z += nz * push;
      }
    }
    if (!a.type.fly) collide(a, a.r);
  }
  // 적 그림
  for (const e of enemies) {
    if (e.dead) continue;
    e.anim += dt * (e.type.fly ? 10 : 6);
    let y = 0, sy = 1;
    if (e.kind === 'slime') { const h = Math.abs(Math.sin(e.anim * 0.9 + e.ph)); y = h * 0.35 * e.sc; sy = h < 0.15 ? 0.85 : 1.05; }
    if (e.type.fly) y = 0.7 + Math.sin(e.anim * 0.5) * 0.12;
    const fr = e.type.fr, f = Math.floor(e.anim / 1.5) % fr.r.length;
    e.sprite.material.map = e.face > 0 ? fr.r[f] : fr.l[f];
    e.sprite.position.set(e.x, y, e.z);
    e.sprite.scale.set(fr.w * U * e.sc, fr.h * U * e.sc * sy, 1);
    e.shadow.position.set(e.x, 0.02, e.z);
    const c = e.sprite.material.color;
    if (e.flash > 0) c.setRGB(1, 0.3, 0.3);
    else if (e.slow > 0) c.setRGB(0.6, 0.8, 1);
    else if (e.elite) c.setRGB(1, 0.85, 0.55);
    else c.setRGB(1, 1, 1);
    e.flash -= dt;
  }

  // 투사체
  for (const pr of projs) {
    pr.life -= dt;
    if (pr.kind === 'bolt') {
      if (!pr.target || pr.target.dead) pr.target = nearest(pr.x, pr.z, 10);
      if (pr.target) {
        const want = Math.atan2(pr.target.z - pr.z, pr.target.x - pr.x), cur = Math.atan2(pr.vz, pr.vx);
        const na = cur + Math.max(-6 * dt, Math.min(6 * dt, angDiff(want, cur)));
        pr.vx = Math.cos(na) * pr.spd; pr.vz = Math.sin(na) * pr.spd;
      }
    }
    pr.x += pr.vx * dt; pr.z += pr.vz * dt;
    for (const e of enemies) {
      if (e.dead || pr.hit.has(e) || pr.life <= 0) continue;
      const dx = e.x - pr.x, dz = e.z - pr.z, d = Math.hypot(dx, dz) || 1;
      if (d < e.r + 0.35) {
        if (pr.kind === 'bolt') { explode(pr); pr.life = 0; break; }
        hurt(e, pr.dmg, pr.vx / pr.spd, pr.vz / pr.spd, 3);
        pr.hit.add(e);
        if (--pr.pierce < 0) { pr.life = 0; break; }
      }
    }
    pr.sprite.position.set(pr.x, pr.y, pr.z);
  }

  // 경험치 / 고기
  for (const g of gems) {
    const dx = P.x - g.x, dz = P.z - g.z, d = Math.hypot(dx, dz) || 1;
    if (g.pull || d < P.st.magnet) {
      g.pull = true;
      const sp = 12 + (P.st.magnet - Math.min(d, P.st.magnet)) * 2;
      g.x += dx / d * sp * dt; g.z += dz / d * sp * dt;
    }
    if (d < 0.6) {
      g.taken = true; scene.remove(g.sprite);
      if (g.kind === 'meat') { P.hp = Math.min(P.maxHp, P.hp + g.val); floater(P.x, 1.9, P.z, '+' + g.val, '#5fe07a', 16); }
      else gainXp(g.val);
      continue;
    }
    g.sprite.position.set(g.x, 0.12 + Math.sin(gameTime * 4 + g.ph) * 0.08, g.z);
  }

  // 정리
  enemies = enemies.filter(e => !e.dead);
  projs = projs.filter(p => { if (p.life > 0) return true; scene.remove(p.sprite); p.sprite.material.dispose(); return false; });
  gems = gems.filter(g => !g.taken);

  if (P.hp <= 0) { P.hp = 0; gameOver(); return; }
  if (pendingLv > 0) openLevelUp();
}

function updateFx(dt) {
  fxs = fxs.filter(f => {
    f.t += dt; f.upd(f, dt);
    if (f.t < f.life) return true;
    scene.remove(f.mesh); f.mesh.geometry.dispose(); f.mesh.material.dispose();
    return false;
  });
  floaters = floaters.filter(f => { f.t += dt; f.y += dt * 1.2; return f.t < 0.7; });
}

const _v = new THREE.Vector3(), _v2 = new THREE.Vector3();
function updateCamera(dt) {
  let sx = 0, sy = 0;
  if (shake > 0) { shake -= dt; sx = (Math.random() - 0.5) * shake * 1.2; sy = (Math.random() - 0.5) * shake * 1.2; }
  camera.position.set(P.x + Math.sin(camYaw) * camDist + sx, camDist * 0.62 + sy, P.z + Math.cos(camYaw) * camDist);
  camera.lookAt(P.x, 0.9, P.z);
  camera.updateMatrixWorld();
  // 화살이 날아가는 방향으로 보이게 회전
  for (const pr of projs) {
    if (pr.kind === 'arrow') {
      _v.set(pr.x, pr.y, pr.z).project(camera);
      _v2.set(pr.x + pr.vx * 0.05, pr.y, pr.z + pr.vz * 0.05).project(camera);
      pr.sprite.material.rotation = Math.atan2((_v2.y - _v.y) * innerHeight, (_v2.x - _v.x) * innerWidth);
    } else pr.sprite.material.rotation += 0.3;
  }
}

// ================= HUD =================
function toScreen(x, y, z) {
  _v.set(x, y, z).project(camera);
  return { x: (_v.x + 1) / 2 * innerWidth, y: (1 - _v.y) / 2 * innerHeight, vis: _v.z < 1 };
}
function txt(s, x, y, size, color, align = 'left', alpha = 1) {
  hctx.globalAlpha = alpha;
  hctx.font = `${size}px Galmuri11, monospace`;
  hctx.textAlign = align; hctx.textBaseline = 'middle';
  hctx.fillStyle = '#000'; hctx.fillText(s, x + 2, y + 2);
  hctx.fillStyle = color; hctx.fillText(s, x, y);
  hctx.globalAlpha = 1;
}
function drawHUD() {
  const w = innerWidth, h = innerHeight;
  hctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  hctx.clearRect(0, 0, w, h);
  if (mode === 'title' || !P) return;

  // 강적 체력바
  for (const e of enemies) {
    if (!e.elite) continue;
    const s = toScreen(e.x, e.h + 0.3, e.z);
    if (!s.vis) continue;
    hctx.fillStyle = '#000'; hctx.fillRect(s.x - 27, s.y - 4, 54, 8);
    hctx.fillStyle = '#ffb347'; hctx.fillRect(s.x - 25, s.y - 2, 50 * Math.max(0, e.hp / e.maxHp), 4);
  }
  // 데미지 숫자
  for (const f of floaters) {
    const s = toScreen(f.x, f.y, f.z);
    if (s.vis) txt(f.text, s.x, s.y, f.size, f.color, 'center', 1 - f.t / 0.7);
  }
  // 피격 화면
  if (P.hurtFx > 0) {
    const g = hctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.7);
    g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, `rgba(220,20,20,${P.hurtFx * 1.5})`);
    hctx.fillStyle = g; hctx.fillRect(0, 0, w, h);
  }
  // 경험치 바
  hctx.fillStyle = '#0d0a16'; hctx.fillRect(0, 0, w, 10);
  hctx.fillStyle = '#5fb8ff'; hctx.fillRect(0, 0, w * P.xp / P.xpNext, 8);
  // 체력 바
  const x = 16, y = 24, bw = Math.min(260, w * 0.42), bh = 18, ratio = Math.max(0, P.hp / P.maxHp);
  hctx.fillStyle = '#000'; hctx.fillRect(x - 3, y - 3, bw + 6, bh + 6);
  hctx.fillStyle = '#3a1020'; hctx.fillRect(x, y, bw, bh);
  hctx.fillStyle = '#e8413c'; hctx.fillRect(x, y, bw * ratio, bh);
  hctx.fillStyle = 'rgba(255,255,255,.25)'; hctx.fillRect(x, y, bw * ratio, 4);
  txt(`${Math.ceil(P.hp)} / ${P.maxHp}`, x + bw / 2, y + bh / 2 + 1, 12, '#fff', 'center');
  txt(`Lv ${P.level}  ${P.C.name}`, x, y + bh + 18, 14, '#f1c40f');
  // 시간 / 처치
  const m = Math.floor(gameTime / 60), s = Math.floor(gameTime % 60);
  txt(`${m}:${String(s).padStart(2, '0')}`, w / 2, 32, 22, '#fff', 'center');
  txt(`처치 ${P.kills}`, w - 16, 32, 14, '#fff', 'right');
  // 스킬 칸
  const bx = w / 2 - 32, by = h - 92, ready = P.skillT <= 0;
  hctx.fillStyle = '#000'; hctx.fillRect(bx - 4, by - 4, 72, 72);
  hctx.fillStyle = ready ? '#3b2a5c' : '#231a35'; hctx.fillRect(bx, by, 64, 64);
  if (!ready) {
    const k = Math.min(1, P.skillT / (P.C.cd * P.st.cd));
    hctx.fillStyle = 'rgba(0,0,0,.55)'; hctx.fillRect(bx, by, 64, 64 * k);
    txt(Math.ceil(P.skillT), bx + 32, by + 32, 20, '#fff', 'center');
  } else {
    hctx.strokeStyle = '#f1c40f'; hctx.lineWidth = 3; hctx.strokeRect(bx + 1.5, by + 1.5, 61, 61);
    txt('SPACE', bx + 32, by + 32, 12, '#f1c40f', 'center');
  }
  txt(P.C.skillName, w / 2, by + 82, 13, '#8fd3ff', 'center');
  if (gameTime < 8) txt('Q / E 로 카메라를 돌려보세요', w / 2, 64, 13, '#fff', 'center', Math.min(1, 8 - gameTime));
}

// ================= 화면 / UI =================
function openLevelUp() {
  mode = 'levelup';
  const pool = UPS.filter(u => !u.cls || u.cls.includes(P.key)).sort(() => Math.random() - 0.5).slice(0, 3);
  const box = $('upCards'); box.innerHTML = '';
  pool.forEach((u, i) => {
    const d = document.createElement('div'); d.className = 'card';
    d.innerHTML = `<h2>${i + 1}. ${u.name}</h2><p>${u.desc}</p><p class="sk">현재 Lv ${P.ups[u.id] || 0}</p>`;
    d.onclick = () => pickUp(u);
    box.appendChild(d);
  });
  box.choices = pool;
  $('levelup').classList.remove('hidden');
}
function pickUp(u) {
  u.apply(P); P.ups[u.id] = (P.ups[u.id] || 0) + 1; pendingLv--;
  $('levelup').classList.add('hidden'); mode = 'play';
  if (pendingLv > 0) openLevelUp();
}
function gameOver() {
  mode = 'over';
  const m = Math.floor(gameTime / 60), s = Math.floor(gameTime % 60);
  $('overStats').innerHTML = `${P.C.name} · 레벨 ${P.level}<br>생존 시간 ${m}분 ${s}초 · 처치 ${P.kills}마리`;
  $('over').classList.remove('hidden');
}
(function buildTitle() {
  const box = $('classCards');
  for (const k in CLASSES) {
    const C = CLASSES[k];
    const d = document.createElement('div'); d.className = 'card';
    const cv = document.createElement('canvas'); cv.width = 16; cv.height = 16;
    cv.getContext('2d').drawImage(pixCanvas(C.rowsA, C.palFull, false), 0, 0);
    d.appendChild(cv);
    d.insertAdjacentHTML('beforeend', `<h2>${C.name}</h2><p>${C.desc}</p><p>체력 ${C.hp} · 속도 ${C.speed}</p><p class="sk">[${C.skillName}] ${C.skillDesc}</p>`);
    d.onclick = () => startGame(k);
    box.appendChild(d);
  }
})();
$('retry').onclick = () => startGame(lastClass);
$('toTitle').onclick = () => { clearWorld(); P = null; mode = 'title'; $('over').classList.add('hidden'); $('title').classList.remove('hidden'); };

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape') {
    if (mode === 'play') { mode = 'pause'; $('pause').classList.remove('hidden'); }
    else if (mode === 'pause') { mode = 'play'; $('pause').classList.add('hidden'); }
  }
  if (mode === 'levelup' && ['Digit1', 'Digit2', 'Digit3'].includes(e.code)) {
    const u = $('upCards').choices[+e.code.slice(5) - 1];
    if (u) pickUp(u);
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
addEventListener('wheel', e => { camDist = Math.max(6, Math.min(18, camDist + Math.sign(e.deltaY) * 0.8)); }, { passive: true });

// ================= 메인 루프 =================
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'play') { update(dt); updateFx(dt); }
  if (mode === 'title' || !P) {
    titleYaw += dt * 0.12;
    camera.position.set(Math.sin(titleYaw) * 16, 9, Math.cos(titleYaw) * 16);
    camera.lookAt(0, 0.5, 0);
  } else updateCamera(mode === 'play' ? dt : 0);
  renderer.render(scene, camera);
  drawHUD();
}
requestAnimationFrame(loop);
</script>
